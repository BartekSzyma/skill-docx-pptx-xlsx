  <g fill="#0f172a" text-anchor="middle">
    <text x="100" y="45" font-weight="700">1. Źródła</text>
    <text x="100" y="67">raport roczny 10-K (SEC)</text>
    <text x="100" y="87">kurs akcji, obligacje</text>
    <text x="100" y="107">zdjęcia z licencją</text>
    <text x="330" y="45" font-weight="700">2. Ledger</text>
    <text x="330" y="67">każdy fakt: źródło,</text>
    <text x="330" y="87">strona i cytat</text>
    <text x="330" y="107">+ założenia osobno</text>
    <text x="560" y="45" font-weight="700">3. Bramka 1: skrypt</text>
    <text x="560" y="67">czy cytat naprawdę</text>
    <text x="560" y="87">jest na tej stronie?</text>
    <text x="560" y="107">(bez AI, zawsze to samo)</text>
    <text x="790" y="45" font-weight="700">4. Bramka 2: model</text>
    <text x="790" y="67">inny model, czysta</text>
    <text x="790" y="87">kartka: czy cytat</text>
    <text x="790" y="104">potwierdza liczbę?</text>
    <text x="560" y="215" font-weight="700">Status weryfikacji</text>
    <text x="560" y="237">zielony = wolno dalej</text>
    <text x="560" y="257">czerwony = poprawiamy</text>
    <text x="560" y="274">ledger, nie dokumenty</text>
    <text x="330" y="215" font-weight="700">5. Generatory</text>
    <text x="330" y="237">skrypty Pythona</text>
    <text x="330" y="257">wstawiają liczby</text>
    <text x="330" y="274">tylko z ledgera</text>
    <text x="115" y="346" font-weight="700">Excel: model DCF</text>
    <text x="115" y="366">formuły i wykresy</text>
    <text x="330" y="346" font-weight="700">PowerPoint</text>
    <text x="330" y="366">projekty ze zdjęciami</text>
    <text x="545" y="346" font-weight="700">Word: 1 strona</text>
    <text x="545" y="366">notatka dla zarządu</text>
    <text x="775" y="333" font-weight="700">6. Kontrola liczb</text>
    <text x="775" y="353">każda liczba w pptx i docx</text>
    <text x="775" y="373">ma pokrycie w ledgerze</text>
    <text x="450" y="428" font-weight="700">7. Skill: wszystkie kroki 1-6 zapisane jako przepis. Wpisujesz /pakiet-analityczny GOOG</text>
    <text x="450" y="446">i Claude robi to samo dla innej spółki, z tymi samymi bramkami</text>
  </g>
