Na koniec pokaż mi tabelkę: id, opis, wartość, strona. Napisz, ile jest wpisów każdej klasy.`;

const PROMPT_P3 = `Do prezentacji potrzebujemy 3-4 zdjęć najważniejszych projektów META (te same projekty co w ledgerze). Bierzemy je tylko z Wikimedia Commons, bo tam każde zdjęcie ma znanego autora i wolną licencję.

  { id: 'krok-6', tytul: '7. Krok 6: model DCF w Excelu', elementy: [
    { typ: 'dlaczego', html: '<ul><li><strong>Formuły, nie gotowe liczby.</strong> Model ma żyć: zmieniasz założenie (np. WACC) i wycena przelicza się sama. Dlatego skrypt wpisuje do Excela formuły, a nie wyniki policzone w Pythonie.</li><li><strong>Niebieskie komórki</strong> to dane wejściowe (z ledgera), czarne to obliczenia. To zwyczaj z bankowości inwestycyjnej: od razu widać, co wolno zmieniać. Obok każdej danej jest id wpisu ledgera, a w komentarzu cytat.</li><li><strong>LibreOffice przelicza plik</strong>, bo biblioteka Pythona zapisuje formuły, ale ich nie liczy. Po przeliczeniu Claude sprawdza, czy żadna komórka nie ma błędu, i odczytuje wynik do pliku <code>wycena.json</code>. Prezentacja i notatka biorą wycenę z tego pliku, więc liczba jest wszędzie ta sama.</li><li><strong>Tabela wrażliwości</strong> pokazuje, jak bardzo wynik zależy od dwóch założeń. To najuczciwsza część każdego DCF.</li></ul>' },
    { typ: 'prompt', id: 'P6', tytul: 'Model DCF w Excelu', tekst: PROMPT_P6 },
    { typ: 'sprawdz', html: 'Otwórz <code>META\\wyniki\\META_DCF.xlsx</code>. W arkuszu Założenia zmień WACC o jeden punkt procentowy (jeśli masz Office bez licencji, zrób to w LibreOffice Calc): wartość jednej akcji w Podsumowaniu musi się zmienić. Najedź myszą na niebieską komórkę: zobaczysz cytat ze źródłem.' },
  ] },
  { id: 'krok-7', tytul: '8. Krok 7: prezentacja', elementy: [
    { typ: 'dlaczego', html: '<p>Prezentację też buduje skrypt, z tych samych danych. Potem Claude zamienia slajdy na obrazki (przez LibreOffice) i <strong>ogląda je</strong>, tak jak zrobiłby to człowiek: szuka ucinanego tekstu i elementów nachodzących na siebie. To pętla „zrób, obejrzyj, popraw”, dzięki której nie musisz poprawiać slajdów ręcznie.</p>' },
    { typ: 'prompt', id: 'P7', tytul: 'Prezentacja', tekst: PROMPT_P7 },
    { typ: 'sprawdz', html: 'Otwórz <code>META\\wyniki\\META_prezentacja.pptx</code>. Przy liczbach są id wpisów ledgera, a pod zdjęciami autor i licencja.' },
  ] },
  { id: 'krok-8', tytul: '9. Krok 8: notatka dla zarządu i kontrola liczb', elementy: [
    { typ: 'dlaczego', html: '<ul><li><strong>Jedna strona</strong> to wymóg zarządu, a nie sugestia. Claude zamienia notatkę na PDF i liczy strony; jeśli wyjdą dwie, skraca tekst.</li><li><strong>Kontrola liczb</strong> to ostatnia bramka. Wyciąga z prezentacji i notatki każdą liczbę i szuka jej w ledgerze i wycenie. Łapie sytuację, w której model w opisie „od siebie” dopisał liczbę, której nie ma w źródłach.</li></ul>' },
    { typ: 'prompt', id: 'P8', tytul: 'Notatka dla zarządu i kontrola liczb', tekst: PROMPT_P8 },
    { typ: 'sprawdz', html: 'Otwórz <code>META\\wyniki\\META_notatka_zarzad.docx</code>: dokładnie jedna strona, a na dole źródła i dopisek o materiale edukacyjnym. Kontrola liczb nie zgłosiła błędów.' },
  ] },
  { id: 'krok-9', tytul: '10. Krok 9: skill pakiet-analityczny', elementy: [
    { typ: 'dlaczego', html: '<p>Do tej pory prowadziłeś Claude krok po kroku. <strong>Skill</strong> zapisuje te kroki jako przepis: plik <code>SKILL.md</code> (co robić i w jakiej kolejności) i folder <code>scripts</code> (sprawdzone narzędzia). Gdy wpiszesz <code>/pakiet-analityczny GOOG</code>, Claude przeczyta przepis i przejdzie wszystkie etapy dla nowej spółki, z tymi samymi bramkami.</p><p>Skill zapisujemy <strong>w folderze projektu</strong> (<code>.claude\\skills</code>), więc działa, gdy uruchomisz Claude w folderze <code>analizy-spolek</code>. Jeśli chcesz go mieć wszędzie, skopiuj folder skilla do <code>.claude\\skills</code> w swoim folderze domowym.</p><p>Uogólnienie na inne spółki to najtrudniejsza część: każda spółka inaczej nazywa pozycje w raporcie, ma inne segmenty i inną liczbę klas akcji. Dlatego prompt wprost o tym mówi.</p>' },

  ] },

const RAMKA_POMOCY = {
  szablon: 'Jestem początkujący, robię instrukcję „Pakiet analityczny spółki”, krok [numer kroku]. Zrobiłem: [co zrobiłem]. Widzę: [komunikat albo co się dzieje]. Wyjaśnij po polsku, co się stało i co mam zrobić.',
  sytuacje: [],
};

const DANE = { LISTA_ZRZUTOW, INSTRUKCJA, RAMKA_POMOCY };

<script id="widok">
const { LISTA_ZRZUTOW: ZRZUTY_LISTA, INSTRUKCJA: SEKCJE, RAMKA_POMOCY: POMOC } = DANE;

function htmlEl(tag, atrybuty = {}, ...dzieci) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(atrybuty)) {
    if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const d of dzieci.flat()) if (d !== null && d !== undefined && d !== false && d !== '') e.append(d);
  return e;
}

async function kopiuj(tekst, przycisk) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(tekst); ok = true; }
  } catch (e) { ok = false; }
  if (!ok) {
    const pole = htmlEl('textarea', { style: 'position:fixed;opacity:0' });
    pole.value = tekst;
    document.body.append(pole);
    pole.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    pole.remove();
  }
  przycisk.textContent = ok ? 'Skopiowano' : 'Zaznacz i skopiuj ręcznie (Ctrl+C)';
  setTimeout(() => { przycisk.textContent = 'Kopiuj'; }, 1800);
}

function przyciskKopiuj(tekst) {
  const b = htmlEl('button', { class: 'kopiuj', type: 'button' }, 'Kopiuj');
  b.addEventListener('click', () => kopiuj(tekst, b));
  return b;
}

function blokKomendy(tekst) {
  return htmlEl('div', { class: 'komenda' }, htmlEl('code', {}, tekst), przyciskKopiuj(tekst));
}

function blokPliku(nazwa, linie) {
  return htmlEl('div', { class: 'plik' },
    htmlEl('div', { class: 'naglowek-pliku' }, nazwa, przyciskKopiuj(linie.join('\r\n'))),
    htmlEl('pre', {}, linie.join('\n')));
}

function blokPromptu(e) {
  return htmlEl('div', { class: 'prompt', id: `prompt-${e.id}` },
    htmlEl('div', { class: 'naglowek-promptu' }, `Prompt ${e.id}: ${e.tytul} - wklej do Claude Code`, przyciskKopiuj(e.tekst)),
    htmlEl('pre', {}, e.tekst));
}

function blokZrzutu(klucz) {
  const opis = ZRZUTY_LISTA.find((z) => z.klucz === klucz).podpis;
  return ZRZUTY[klucz]
    ? htmlEl('figure', { class: 'zrzut' }, htmlEl('img', { src: ZRZUTY[klucz], alt: opis, loading: 'lazy' }), htmlEl('figcaption', {}, opis))
    : htmlEl('div', { class: 'brak-zrzutu' }, `Zrzut: ${opis}`);
}

function elementInstrukcji(e) {
  if (e.typ === 'tekst') return htmlEl('div', { html: e.html });
  if (e.typ === 'komenda') return blokKomendy(e.tekst);
  if (e.typ === 'plik') return blokPliku(e.nazwa, e.linie);
  if (e.typ === 'prompt') return blokPromptu(e);
  if (e.typ === 'dlaczego') return htmlEl('div', { class: 'dlaczego', html: '<strong>Co się dzieje i po co</strong>' + e.html });
  if (e.typ === 'schemat') return htmlEl('div', { class: 'schemat', html: e.svg });
  if (e.typ === 'sprawdz') return htmlEl('div', { class: 'sprawdz', html: '<strong>Sprawdź:</strong> ' + e.html });
  if (e.typ === 'uwaga') return htmlEl('div', { class: 'uwaga', html: e.html });
  if (e.typ === 'wazne') return htmlEl('div', { class: 'wazne', html: e.html });
  if (e.typ === 'mac') return htmlEl('div', { class: 'mac', html: '<strong>Na Macu:</strong> ' + e.html });
  if (e.typ === 'zrzut') return blokZrzutu(e.klucz);
  return null;
}

function budujInstrukcje() {
  const sekcje = SEKCJE.map((s) => htmlEl('section', { id: s.id }, htmlEl('h2', {}, s.tytul), ...s.elementy.map(elementInstrukcji)));
  const ramka = htmlEl('section', { id: 'gdy-cos-nie-tak', class: 'ramka-pomocy' },
    htmlEl('h2', {}, 'Gdy coś pójdzie nie tak'),
    htmlEl('p', {}, 'Skopiuj ten szablon, uzupełnij nawiasy kwadratowe i wklej do Claude Code - wyjaśni, co się stało:'),
    htmlEl('div', { class: 'plik' }, htmlEl('div', { class: 'naglowek-pliku' }, 'Pytanie do Claude Code', przyciskKopiuj(POMOC.szablon)), htmlEl('pre', {}, POMOC.szablon)),
    ...POMOC.sytuacje.map((s) => htmlEl('div', {}, htmlEl('h3', {}, s.tytul), htmlEl('div', { html: s.html }))));
  document.getElementById('instrukcja').replaceChildren(...sekcje, ramka);
  document.getElementById('spis').replaceChildren(htmlEl('strong', {}, 'Spis treści'),
    htmlEl('ol', {}, ...SEKCJE.map((s) => htmlEl('li', {}, htmlEl('a', { href: `#${s.id}` }, s.tytul))),
      htmlEl('li', {}, htmlEl('a', { href: '#gdy-cos-nie-tak' }, 'Gdy coś pójdzie nie tak'))));
}

window.addEventListener('load', budujInstrukcje);
</script>
<script id="zrzuty">
const ZRZUTY = {};
</script>
