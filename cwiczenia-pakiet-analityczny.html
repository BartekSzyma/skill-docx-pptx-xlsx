Na koniec pokaż mi tabelkę: id, opis, wartość, strona. Napisz, ile jest wpisów każdej klasy.`;

- 3 projekty, każdy w jednym zdaniu;
- 3 ryzyka, każde w jednym zdaniu;
- źródła drobnym drukiem (id wpisów i strony 10-K) i dopisek: „Materiał edukacyjny, nie stanowi rekomendacji inwestycyjnej.”

Po zapisaniu:
1. Zamień plik na PDF przez LibreOffice i sprawdź, że ma dokładnie 1 stronę. Jeśli ma więcej, skróć tekst (czcionka nie mniejsza niż 9 pt).
2. Napisz skrypt narzedzia/sprawdz_liczby.py TICKER: wyciąga wszystkie liczby z tekstu pptx i docx i sprawdza, że każda ma pokrycie w ledger.json albo wycena.json (z uwzględnieniem zaokrągleń i zapisu w mld lub mln); pomija lata, numery slajdów i id wpisów. Liczba bez pokrycia to błąd z podaniem pliku i miejsca.
3. Uruchom kontrolę dla META i popraw generatory, jeśli coś nie przejdzie.
Pokaż mi podsumowanie.`;

const PROMPT_P9 = `Zamień to, co zbudowaliśmy, w skill Claude Code o nazwie pakiet-analityczny, żeby dla innej spółki wystarczyło napisać /pakiet-analityczny TICKER. Skorzystaj ze skilla skill-creator, jeśli go masz.

1. Utwórz skill w folderze projektu: .claude/skills/pakiet-analityczny/ z plikiem SKILL.md i podfolderem scripts/ z kopiami skryptów z narzedzia/. Skill ma działać sam, bez folderu narzedzia/.
2. SKILL.md opisuje po polsku kolejne kroki dokładnie tak, jak robiliśmy je dla META: pobranie 10-K i danych rynkowych, ledger (te same klasy wpisów, zasady cytatów i klucze), zdjęcia z licencją z Wikimedia Commons, weryfikacja dwiema bramkami z poprawianiem wpisów aż do zielonego statusu, Excel z DCF, prezentacja, notatka i kontrola liczb. Wyniki trafiają do folderu TICKER/.
3. Skill przyjmuje ticker jako argument. Na początku sprawdza, czy spółka składa raport 10-K w SEC i czy nie jest bankiem ani ubezpieczycielem (ten model DCF do nich nie pasuje). Jeśli nie spełnia warunków, kończy z jasnym komunikatem po polsku.
4. Uwzględnij różnice między spółkami: inne nazwy pozycji w raporcie, inna liczba klas akcji (np. Alphabet ma klasy A, B i C), inne segmenty albo ich brak. Skrypty nie mogą zakładać nazw pozycji ani segmentów Meta.
5. Adres e-mail do nagłówka User-Agent zostaje taki sam jak w narzedzia/pobierz_10k.py.
Nie uruchamiaj skilla. Na koniec napisz mi, jak go wywołać.`;

const PROMPT_P10 = `/pakiet-analityczny GOOG`;

const INSTRUKCJA = [
  { id: 'zanim-zaczniesz', tytul: '0. Zanim zaczniesz', elementy: [
    { typ: 'tekst', html: 'Treść do uzupełnienia.' },
    { typ: 'prompt', id: 'P1', tytul: 'Zasady projektu i źródła', tekst: PROMPT_P1 },
    { typ: 'prompt', id: 'P2', tytul: 'Ledger: fakty, dane rynkowe, założenia', tekst: PROMPT_P2 },
    { typ: 'prompt', id: 'P3', tytul: 'Zdjęcia projektów z licencją', tekst: PROMPT_P3 },
    { typ: 'prompt', id: 'P4', tytul: 'Weryfikacja: dwie bramki', tekst: PROMPT_P4 },
    { typ: 'prompt', id: 'P5', tytul: 'Test pułapek', tekst: PROMPT_P5 },
    { typ: 'prompt', id: 'P6', tytul: 'Model DCF w Excelu', tekst: PROMPT_P6 },
    { typ: 'prompt', id: 'P7', tytul: 'Prezentacja', tekst: PROMPT_P7 },
    { typ: 'prompt', id: 'P8', tytul: 'Notatka dla zarządu i kontrola liczb', tekst: PROMPT_P8 },
    { typ: 'prompt', id: 'P9', tytul: 'Skill pakiet-analityczny', tekst: PROMPT_P9 },
    { typ: 'prompt', id: 'P10', tytul: 'Pakiet dla Alphabet jednym poleceniem', tekst: PROMPT_P10 },
  ] },
];

const RAMKA_POMOCY = {
  szablon: 'Jestem początkujący, robię instrukcję „Pakiet analityczny spółki”, krok [numer kroku]. Zrobiłem: [co zrobiłem]. Widzę: [komunikat albo co się dzieje]. Wyjaśnij po polsku, co się stało i co mam zrobić.',
  sytuacje: [],
};

const DANE = { LISTA_ZRZUTOW, INSTRUKCJA, RAMKA_POMOCY };
</script>
<script id="widok">
const { LISTA_ZRZUTOW: ZRZUTY_LISTA, INSTRUKCJA: SEKCJE, RAMKA_POMOCY: POMOC } = DANE;

function htmlEl(tag, atrybuty = {}, ...dzieci) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(atrybuty)) {
    if (k === 'html') e.innerHTML = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v);
  }
  for (const d of dzieci.flat()) if (d !== null && d !== undefined && d !== false && d !== '') e.append(d);
  return e;
}

async function kopiuj(tekst, przycisk) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(tekst); ok = true; }
  } catch (e) { ok = false; }
  if (!ok) {
    const pole = htmlEl('textarea', { style: 'position:fixed;opacity:0' });
    pole.value = tekst;
    document.body.append(pole);
    pole.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    pole.remove();
  }
  przycisk.textContent = ok ? 'Skopiowano' : 'Zaznacz i skopiuj ręcznie (Ctrl+C)';
  setTimeout(() => { przycisk.textContent = 'Kopiuj'; }, 1800);
}

function przyciskKopiuj(tekst) {
  const b = htmlEl('button', { class: 'kopiuj', type: 'button' }, 'Kopiuj');
  b.addEventListener('click', () => kopiuj(tekst, b));
  return b;
}

function blokKomendy(tekst) {
  return htmlEl('div', { class: 'komenda' }, htmlEl('code', {}, tekst), przyciskKopiuj(tekst));
}

function blokPliku(nazwa, linie) {
  return htmlEl('div', { class: 'plik' },
    htmlEl('div', { class: 'naglowek-pliku' }, nazwa, przyciskKopiuj(linie.join('\r\n'))),
    htmlEl('pre', {}, linie.join('\n')));
}

function blokPromptu(e) {
  return htmlEl('div', { class: 'prompt', id: `prompt-${e.id}` },
    htmlEl('div', { class: 'naglowek-promptu' }, `Prompt ${e.id}: ${e.tytul} - wklej do Claude Code`, przyciskKopiuj(e.tekst)),
    htmlEl('pre', {}, e.tekst));
}

function blokZrzutu(klucz) {
  const opis = ZRZUTY_LISTA.find((z) => z.klucz === klucz).podpis;
  return ZRZUTY[klucz]
    ? htmlEl('figure', { class: 'zrzut' }, htmlEl('img', { src: ZRZUTY[klucz], alt: opis, loading: 'lazy' }), htmlEl('figcaption', {}, opis))
    : htmlEl('div', { class: 'brak-zrzutu' }, `Zrzut: ${opis}`);
}

function elementInstrukcji(e) {
  if (e.typ === 'tekst') return htmlEl('div', { html: e.html });
  if (e.typ === 'komenda') return blokKomendy(e.tekst);
  if (e.typ === 'plik') return blokPliku(e.nazwa, e.linie);
  if (e.typ === 'prompt') return blokPromptu(e);
  if (e.typ === 'dlaczego') return htmlEl('div', { class: 'dlaczego', html: '<strong>Co się dzieje i po co</strong>' + e.html });
  if (e.typ === 'schemat') return htmlEl('div', { class: 'schemat', html: e.svg });
  if (e.typ === 'sprawdz') return htmlEl('div', { class: 'sprawdz', html: '<strong>Sprawdź:</strong> ' + e.html });
  if (e.typ === 'uwaga') return htmlEl('div', { class: 'uwaga', html: e.html });
  if (e.typ === 'wazne') return htmlEl('div', { class: 'wazne', html: e.html });
  if (e.typ === 'mac') return htmlEl('div', { class: 'mac', html: '<strong>Na Macu:</strong> ' + e.html });
  if (e.typ === 'zrzut') return blokZrzutu(e.klucz);
  return null;
}

function budujInstrukcje() {
  const sekcje = SEKCJE.map((s) => htmlEl('section', { id: s.id }, htmlEl('h2', {}, s.tytul), ...s.elementy.map(elementInstrukcji)));
  const ramka = htmlEl('section', { id: 'gdy-cos-nie-tak', class: 'ramka-pomocy' },
    htmlEl('h2', {}, 'Gdy coś pójdzie nie tak'),
    htmlEl('p', {}, 'Skopiuj ten szablon, uzupełnij nawiasy kwadratowe i wklej do Claude Code - wyjaśni, co się stało:'),
    htmlEl('div', { class: 'plik' }, htmlEl('div', { class: 'naglowek-pliku' }, 'Pytanie do Claude Code', przyciskKopiuj(POMOC.szablon)), htmlEl('pre', {}, POMOC.szablon)),
    ...POMOC.sytuacje.map((s) => htmlEl('div', {}, htmlEl('h3', {}, s.tytul), htmlEl('div', { html: s.html }))));
  document.getElementById('instrukcja').replaceChildren(...sekcje, ramka);
  document.getElementById('spis').replaceChildren(htmlEl('strong', {}, 'Spis treści'),
    htmlEl('ol', {}, ...SEKCJE.map((s) => htmlEl('li', {}, htmlEl('a', { href: `#${s.id}` }, s.tytul))),
      htmlEl('li', {}, htmlEl('a', { href: '#gdy-cos-nie-tak' }, 'Gdy coś pójdzie nie tak'))));
}

window.addEventListener('load', budujInstrukcje);
</script>
<script id="zrzuty">
const ZRZUTY = {};
</script>
</body>
</html>
